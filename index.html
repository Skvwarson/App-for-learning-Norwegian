<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Norsk Nå</title>
  <meta name="description" content="Learn conversational Norwegian with spaced repetition, active recall, comprehensible input, one button a day.">
  <meta name="theme-color" content="#ba0c2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Norsk Nå">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply a saved Light/Dark choice before anything is drawn (no flash of the wrong theme).
    try { var t = (JSON.parse(localStorage.getItem('norsk-na.v1') || '{}').settings || {}).theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    /* Ghost view: the shape of the app, shown until the real screen replaces it. */
    html, body { overscroll-behavior: none; }
    .gh { background: var(--surface-2, #e9e6df); border-radius: 10px; position: relative; overflow: hidden; }
    .gh::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface, #fff) 55%, transparent), transparent);
      animation: ghShine 1.4s ease-in-out infinite; }
    @keyframes ghShine { to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .gh::after { animation: none; } }
    .gh-card { background: var(--surface, #fff); border: 1px solid var(--border, #e8e4dc); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .gh-stack { display: flex; flex-direction: column; gap: 14px; }
    .gh-row { display: flex; align-items: center; gap: 12px; }
    .gh-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .gh-topbar { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .gh-tabs { display: flex; justify-content: space-around; align-items: center; height: 64px; max-width: 440px; margin: 0 auto; }
    .gh-dot { border-radius: 50%; }
  </style>
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="gh-topbar" aria-hidden="true">
      <div class="gh-row"><div class="gh" style="width:26px;height:19px;border-radius:4px"></div><div class="gh" style="width:90px;height:18px"></div></div>
      <div class="gh-row"><div class="gh" style="width:52px;height:36px;border-radius:999px"></div><div class="gh gh-dot" style="width:36px;height:36px"></div></div>
    </div>
  </header>
  <main id="view">
    <div class="gh-stack" aria-busy="true" aria-label="Loading">
      <div class="gh-stack" style="gap:8px;margin-top:4px">
        <div class="gh" style="width:62%;height:30px"></div>
        <div class="gh" style="width:48%;height:16px"></div>
      </div>
      <div class="gh-card">
        <div class="gh-row" style="justify-content:space-between"><div class="gh" style="width:60px;height:12px"></div><div class="gh" style="width:54px;height:12px"></div></div>
        <div class="gh-tiles">
          <div class="gh" style="height:84px;border-radius:16px"></div><div class="gh" style="height:84px;border-radius:16px"></div>
          <div class="gh" style="height:84px;border-radius:16px"></div><div class="gh" style="height:84px;border-radius:16px"></div>
        </div>
        <div class="gh" style="height:68px;border-radius:18px"></div>
      </div>
      <div class="gh-card">
        <div class="gh" style="width:40%;height:12px"></div>
        <div class="gh" style="height:30px"></div>
        <div class="gh" style="height:30px"></div>
        <div class="gh" style="width:35%;height:12px"></div>
      </div>
      <div class="gh-card" style="flex-direction:row;align-items:center">
        <div class="gh gh-dot" style="width:48px;height:48px;flex:none"></div>
        <div class="gh-stack" style="gap:8px;flex:1"><div class="gh" style="width:30%;height:12px"></div><div class="gh" style="width:55%;height:18px"></div></div>
      </div>
    </div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Main">
    <div class="gh-tabs" aria-hidden="true">
      <div class="gh gh-dot" style="width:36px;height:36px"></div>
      <div class="gh gh-dot" style="width:58px;height:58px;transform:translateY(-14px)"></div>
      <div class="gh gh-dot" style="width:36px;height:36px"></div>
    </div>
  </nav>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Norsk Nå needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
